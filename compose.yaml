services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/leetkob.sqlite
      PORT: 3007
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_OFF: ${MODEL_OFF:-0}
    volumes:
      - ${LEETKOB_DATA_DIR:-leetkob-data}:/data
    ports:
      - '${PORT:-3007}:3007'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3007/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Containerized worker works with MODEL_OFF=0/1 if Docker is reachable on host.
  # For live VPS deployment with Docker sandbox judging (M8: no docker.sock inside containers),
  # set LEETKOB_DATA_DIR=./data and run the worker directly on the host:
  #   DATABASE_URL=./data/leetkob.sqlite npm run worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'scripts/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/leetkob.sqlite
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_OFF: ${MODEL_OFF:-0}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-leetkob-sandbox:latest}
    volumes:
      - ${LEETKOB_DATA_DIR:-leetkob-data}:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  leetkob-data:
