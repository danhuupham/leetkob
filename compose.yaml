services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/leetkob.sqlite
      PORT: 3007
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:-gemini-3-flash-preview}
      MODEL_OFF: ${MODEL_OFF:-0}
    volumes:
      - ${LEETKOB_DATA_DIR:-leetkob-data}:/data
    ports:
      - '${PORT:-3007}:3007'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3007/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Default `docker compose up` starts only `app` (worker has profile `container-worker`
  # because M8 forbids mounting docker.sock or Docker CLI inside judge/app containers).
  # For live VPS deployment with Docker sandbox judging:
  #   LEETKOB_DATA_DIR=./data SESSION_SECRET=<secret> MODEL_API_KEY=<key> docker compose up -d --build
  #   DATABASE_URL=./data/leetkob.sqlite SANDBOX_IMAGE=leetkob-sandbox:latest MODEL_NAME=gemini-3-flash-preview MODEL_API_KEY=<key> npm run worker
  worker:
    profiles: ['container-worker']
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'scripts/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/leetkob.sqlite
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:-gemini-3-flash-preview}
      MODEL_OFF: ${MODEL_OFF:-0}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-leetkob-sandbox:latest}
    volumes:
      - ${LEETKOB_DATA_DIR:-leetkob-data}:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  leetkob-data:
